<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards: Hvordan skrive en CV</title>
<style>
:root{--bg:#F3F7FB;--card:#FFFFFF;--ink:#17324D;--mute:#5B6F84;--line:#D5E0EB;--brand:#1F5A8C;--sun:#F5B83D;--ok:#1E8A62;--okbg:#DDF3EA;--bad:#C93C3C;--badbg:#FBE3E1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B28;--card:#182A3C;--ink:#EAF1F8;--mute:#9DB1C5;--line:#2C4258;--brand:#6FB1E8;--ok:#5ED0A0;--okbg:#17402F;--bad:#FF8A84;--badbg:#472122}}
:root[data-theme="dark"]{--bg:#0F1B28;--card:#182A3C;--ink:#EAF1F8;--mute:#9DB1C5;--line:#2C4258;--brand:#6FB1E8;--ok:#5ED0A0;--okbg:#17402F;--bad:#FF8A84;--badbg:#472122}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Nunito","Segoe UI",Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--brand)}
.sub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.dots{display:flex;gap:4px;margin-bottom:16px}
.dot{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dot.now{background:var(--sun)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--mute);font-size:.9rem}
.badge{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--card);display:grid;place-items:center;font-weight:800}
.scene{perspective:1200px}
.flip{position:relative;width:100%;min-height:360px;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;transform-style:preserve-3d;transition:transform .5s}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;border:2px solid var(--line);background:var(--card)}
.front{border-top:8px solid var(--brand)}
.back{transform:rotateY(180deg);background:var(--okbg);border:2px solid var(--ok);border-top:8px solid var(--ok)}
.lab{font-size:.85rem;color:var(--mute);margin-bottom:8px}
.back .lab{color:var(--ok)}
.q{font-size:1.3rem;font-weight:800;margin:0}
.a{font-size:1.3rem;font-weight:800;color:var(--ok);margin:0 0 10px}
.ex{margin:0}
.tap{margin-top:14px;font-size:.9rem;color:var(--mute)}
.flip:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;flex:1;min-width:130px}
.know{background:var(--ok);color:#fff}.more{background:var(--bad);color:#fff}
.nav{background:var(--brand);color:var(--card)}
.alt{background:var(--sun);color:#3A2A00}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px;text-align:center}
.big{font-size:3rem;font-weight:800;color:var(--ok)}
.ico{width:76px;height:76px;margin-bottom:12px;flex:none}
.ico .s{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico .p{fill:var(--card);stroke:var(--brand);stroke-width:3;stroke-linejoin:round}
.ico .y{fill:var(--sun);stroke:var(--brand);stroke-width:3;stroke-linejoin:round}
.ico .l{fill:var(--line)}.ico .b{fill:var(--brand)}.ico .g{fill:var(--ok)}.ico .f{fill:var(--sun)}
.ico .sg{fill:none;stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.ico .w{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.ico .bt{fill:var(--brand)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>Flashcards: Hvordan skrive en CV</h1>
<p class="sub">Trykk på kortet for å se svaret.</p>
<div class="dots" id="dots"></div>
<div id="main"></div>
</div>
<script>
var D=[
["A","Hvordan må de som søker på jobber være?","Aktive","De som søker på jobber må være aktive."],
["A","Hva kan være viktig for å få jobben?","En god CV","En god CV kan være viktig for å få jobben."],
["B","Hva er en CV?","En kort oversikt over det du har gjort i livet ditt","Utdanning, arbeidserfaring og kurs er ting som skal være med."],
["B","Hva sender du sammen med søknaden?","En CV","Når du søker jobb, sender du alltid en CV sammen med søknaden."],
["B","Hva skal være med i en CV?","Utdanning, arbeidserfaring og kurs","Dette er viktig for en arbeidsgiver å vite."],
["C","Hva skal en CV starte med?","Personalia","Navn, fødselsdato, adresse, mobilnummer og e-post."],
["C","Hva er overskriften i CV-en?","Navnet ditt","Navnet ditt er overskriften i CV-en."],
["D","Hva slags bilde skal du velge?","Et bilde av deg selv med rolig bakgrunn","Bruk gjerne en hvit vegg. Ta bildet fra skuldrene og opp."],
["D","Hvordan skal du kle deg på bildet?","Som du ville gjort til et jobbintervju","Arbeidsgivere liker at det er bilde av deg i CV-en."],
["E","Hva betyr nøkkelkvalifikasjoner?","Du forteller om noe du er spesielt god på","Teksten bør være kort og passe til det arbeidsgiveren spør om."],
["E","Hvor skal nøkkelkvalifikasjonene stå?","Tidlig i CV-en, etter personalia","Arbeidsgivere bruker liten tid på å lese CV-en."],
["F","Hvilken jobb skriver du først?","Den nyeste jobben","Skriv også kort om oppgavene dine og ansvarsområdet ditt."],
["F","Skal du skrive om jobber fra hjemlandet?","Ja","Husk å skrive om jobber fra hjemlandet ditt også."],
["G","Hvilken utdanning skriver du først?","Den nyeste utdanningen","Husk å ta med utdanningen fra hjemlandet ditt."],
["H","Hva kan du skrive under «Kurs»?","Kurs du har deltatt på","For eksempel et kurs i førstehjelp."],
["H","Hva er viktig å skrive om språk?","Hvilke språk du kan","Det er også fint å skrive om dataprogrammer du kan."],
["I","Hva kan du skrive under «Interesser»?","Hva du gjør på fritiden, for eksempel frivillig arbeid","Det forteller noe om deg som person."],
["J","Hva er en referanse?","En person som kan fortelle hvordan du er å jobbe med","Skriv riktig navn og mobilnummer til referansen."],
["J","Hva betyr «Referanser gis på forespørsel»?","Du gir navn og telefonnummer hvis noen spør","Du trenger ikke skrive navnene i CV-en."],
["K","Hvor lang bør en CV være?","Én side","CV-en bør få fram de viktigste opplysningene om deg."]
];
var PAPER='<rect class="p" x="14" y="6" width="36" height="52" rx="4"/>';
var I={
mtn:'<path class="y" d="M4 54 26 20 40 40 48 30 60 54Z"/><path class="s" d="M26 20V6"/><path class="g" d="M26 6h14l-4 5 4 5H26Z"/>',
doc:PAPER+'<circle class="b" cx="32" cy="22" r="6"/><path class="b" d="M21 38a11 9 0 0 1 22 0Z"/><path class="s" d="M22 46h20M22 52h12"/>',
list:PAPER+'<path class="sg" d="M20 17l3 3 6-6M20 31l3 3 6-6M20 45l3 3 6-6"/><path class="s" d="M35 18h9M35 32h9M35 46h9"/>',
id:'<rect class="p" x="6" y="14" width="52" height="36" rx="5"/><circle class="b" cx="21" cy="29" r="6"/><path class="b" d="M11 44a10 8 0 0 1 20 0Z"/><path class="s" d="M38 26h14M38 33h14M38 40h10"/>',
head:PAPER+'<path class="b" d="M20 14h24v8H20Z"/><path class="s" d="M20 32h24M20 40h24M20 48h14"/>',
top:PAPER+'<rect class="l" x="20" y="12" width="24" height="8" rx="2"/><rect class="f" x="20" y="25" width="24" height="10" rx="2"/><path class="s" d="M20 42h24M20 49h24"/>',
photo:'<rect class="l" x="8" y="8" width="48" height="48" rx="5"/><circle class="b" cx="32" cy="26" r="9"/><path class="b" d="M14 56a18 15 0 0 1 36 0Z"/><rect class="s" x="8" y="8" width="48" height="48" rx="5"/>',
shirt:'<path class="p" d="M22 8 8 18l7 10 7-4v32h20V24l7 4 7-10L42 8c-2 5-5 7-10 7s-8-2-10-7Z"/><path class="f" d="M32 16l-3 4 3 4 3-4ZM30 24h4l2 24-4 4-4-4Z"/>',
key:'<circle class="y" cx="20" cy="32" r="12"/><circle class="p" cx="20" cy="32" r="4"/><path class="s" d="M32 32h26M48 32v9M56 32v7"/>',
brief:'<rect class="p" x="6" y="20" width="52" height="34" rx="5"/><path class="s" d="M24 20v-6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6M6 36h52"/><rect class="y" x="28" y="32" width="8" height="8" rx="2"/>',
globe:'<circle class="p" cx="32" cy="32" r="24"/><path class="s" d="M8 32h48M32 8c-12 12-12 36 0 48M32 8c12 12 12 36 0 48"/>',
cap:'<path class="b" d="M32 10 4 24l28 14 28-14Z"/><path class="p" d="M16 32v12c0 5 8 9 16 9s16-4 16-9V32L32 40Z"/><path class="s" d="M58 25v18"/><circle class="f" cx="58" cy="46" r="3"/>',
cert:'<rect class="p" x="6" y="8" width="52" height="38" rx="4"/><path class="s" d="M16 20h32M16 28h32M16 36h14M42 48l-3 10 7-4 7 4-3-10"/><circle class="y" cx="46" cy="40" r="8"/>',
lang:'<path class="p" d="M6 8h30a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H20l-8 8v-8H6a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z"/><path class="y" d="M30 30h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4h-4v8l-8-8H30a4 4 0 0 1-4-4V34a4 4 0 0 1 4-4Z"/>',
heart:'<path class="y" d="M32 56C10 40 6 28 6 20a13 13 0 0 1 26-3 13 13 0 0 1 26 3c0 8-4 20-26 36Z"/>',
ref:'<circle class="b" cx="26" cy="20" r="10"/><path class="b" d="M6 56a20 16 0 0 1 40 0Z"/><circle class="g" cx="48" cy="42" r="11"/><path class="w" d="M42 42l4 4 7-8"/>',
phone:'<rect class="p" x="18" y="4" width="28" height="56" rx="6"/><path class="sg" d="M24 18h16M24 28h16M24 38h10"/><circle class="y" cx="32" cy="52" r="3"/>',
page:PAPER+'<path class="s" d="M22 15h20"/><text class="bt" x="32" y="46" text-anchor="middle" font-size="28" font-weight="800">1</text>'
};
var ICO=['mtn','doc','doc','doc','list','id','head','photo','shirt','key','top','brief','globe','cap','cert','lang','heart','ref','phone','page'];
function ic(k){return '<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">'+I[ICO[k]]+'</svg>'}
var deck=D.map(function(_,k){return k}),pos=0,mark={},flipped=false;
var main=document.getElementById("main"),dots=document.getElementById("dots");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function drawDots(){dots.innerHTML=deck.map(function(id,k){var c=mark[id]===undefined?(k===pos?"now":""):(mark[id]?"ok":"bad");return '<div class="dot '+c+'"></div>'}).join("")}
function show(){
 flipped=false;drawDots();var c=D[deck[pos]];
 main.innerHTML='<div class="top"><div class="badge">'+c[0]+'</div><div>Kort '+(pos+1)+' av '+deck.length+'</div></div>'+
 '<div class="scene"><button class="flip" id="fl" aria-label="Snu kortet">'+
 '<div class="face front">'+ic(deck[pos])+'<div class="lab">Spørsmål</div><p class="q">'+esc(c[1])+'</p><div class="tap">Trykk for å se svaret</div></div>'+
 '<div class="face back">'+ic(deck[pos])+'<div class="lab">Svar</div><p class="a">'+esc(c[2])+'</p><p class="ex">'+esc(c[3])+'</p></div>'+
 '</button></div>'+
 '<div class="row"><button class="btn more" data-m="0">Øv mer</button><button class="btn know" data-m="1">Jeg kan dette</button></div>'+
 '<div class="row"><button class="btn nav" id="pv"'+(pos===0?' disabled style="opacity:.4"':'')+'>Tilbake</button><button class="btn nav" id="nx">Neste</button></div>';
 var fl=document.getElementById("fl");
 fl.onclick=function(){flipped=!flipped;fl.classList.toggle("on",flipped)};
 Array.prototype.forEach.call(main.querySelectorAll("[data-m]"),function(b){b.onclick=function(){mark[deck[pos]]=b.dataset.m==="1";next()}});
 document.getElementById("pv").onclick=function(){if(pos>0){pos--;show()}};
 document.getElementById("nx").onclick=next;
}
function next(){if(pos<deck.length-1){pos++;show()}else done()}
function done(){
 drawDots();var know=0,more=[];
 deck.forEach(function(id){if(mark[id]===true)know++;else more.push(id)});
 var h='<div class="card"><div class="big">'+know+' av '+deck.length+'</div><p class="q">'+(more.length?"Du kan "+know+" kort. Øv på resten én gang til.":"Flott! Du kan alle kortene.")+'</p><div class="row">';
 if(more.length)h+='<button class="btn more" id="rm">Øv på '+more.length+' kort</button>';
 h+='<button class="btn alt" id="ra">Start på nytt</button></div></div>';
 main.innerHTML=h;
 var rm=document.getElementById("rm");
 if(rm)rm.onclick=function(){deck=more;pos=0;mark={};show()};
 document.getElementById("ra").onclick=function(){deck=D.map(function(_,k){return k});pos=0;mark={};show()};
}
show();
</script>
</body>
</html>
